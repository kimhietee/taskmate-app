# Render Blueprint for TaskMate Live Beta Deployment
services:
  - type: web
    name: taskmate
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: TaskMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://taskmate-sq9u.onrender.com
      # Leave ASSET_URL unset so Vite assets always load from the active service domain.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: taskmate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taskmate-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: taskmate-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: taskmate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskmate-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Prototype beta controls (keep prototype_mode=true for classmate testing)
      - key: TASKMATE_PROTOTYPE_MODE
        value: "true"
      # Set MAIL_MAILER=smtp (+ MAIL_HOST/PORT/USERNAME/PASSWORD) to send real Gmail/CMU codes,
      # or keep MAIL_MAILER=log + TASKMATE_PROTOTYPE_MAILBOX=true to use the in-browser Prototype Mail tab.
      - key: MAIL_MAILER
        value: log
      - key: TASKMATE_PROTOTYPE_MAILBOX
        value: "true"
      - key: MAIL_FROM_ADDRESS
        value: noreply@taskmate.example.test
      - key: MAIL_FROM_NAME
        value: TaskMate
      - key: TASKMATE_REQUIRE_INSTITUTIONAL_EMAIL
        value: "false"
      - key: TASKMATE_AUTO_VERIFY_INSTITUTIONAL_STUDENT
        value: "true"
      - key: TASKMATE_UNVERIFIED_STUDENTS_CAN_BROWSE
        value: "true"

databases:
  - name: taskmate-db
    plan: free
    databaseName: taskmate
    user: taskmate
